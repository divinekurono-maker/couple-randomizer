const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function chooseWithHistory(pool,history,windowSize){
  const candidates=pool.filter(x=>!history.includes(x.label));
  const chosen=pick(candidates.length?candidates:pool);

  if(history.length>windowSize)history.shift();
  return chosen;
}
const recentCompositions=[];
function pickComposition(candidates){
  const scored=candidates.map(item=>{
    const last=recentCompositions.slice(-7);
    const penalty=last.reduce((n,x,i)=>n+(x===item.key?20+i*2:0),0);
    return {...item,penalty};
  });
  const minimum=Math.min(...scored.map(x=>x.penalty));
  const best=scored.filter(x=>x.penalty===minimum);
  const result=pick(best);
  recentCompositions.push(result.key);
  if(recentCompositions.length>8)recentCompositions.shift();
  return result;
}

  }
  if(c.poseKind==='sit' && /向かい合って座り/.test(pose)){
    if(sofa)pose=pose.replace('向かい合って座り','同じソファに隣り合って座り、互いの方へ上半身を向け');
    else if(watching)pose=pose.replace('向かい合って座り','同じ方向を向いて隣り合って座り、触れ合うときだけ互いの方へ上半身を向け');
    else if(act.kind==='table')pose=pose.replace('向かい合って座り','机の角を挟んで手が届く距離に向かい合って座り');
    else if(tabletop)pose=pose.replace('向かい合って座り','小さなテーブルの角を挟んで手が届く距離に向かい合って座り');
    else if(/ベンチ/.test(place))pose=pose.replace('向かい合って座り','同じベンチに隣り合って座り、互いの方へ上半身を向け');
  }else if(c.poseKind==='sit' && /隣り合って座り/.test(pose) && act.kind==='table'){
    pose=pose.replace('隣り合って座り','机の同じ側に隣り合って座り');
  }
  if(c.poseKind==='sit' && /向かい合って座り/.test(pose) && /ベンチ/.test(place)){
    pose=pose.replace('向かい合って座り','同じベンチに隣り合って座り、互いの方へ上半身を向け');
  }
  // 画像生成テストで確認したポーズの明確化
  if(c.label==='手の大きさを比べる'){
    // 合格した画像テストの手元配置を優先する。Bの空いた手だけを指差しに使う。
    pose += '。ふたりは片手ずつを胸の高さに上げ、指を自然に伸ばしている。Aの空いている手は膝の上に置く。Bの空いている手は人差し指だけを伸ばし、合わせた指先の長さを示している';
    action='AとBが片手ずつの手のひらを正面からそっと合わせ、指先の長さを比べる。Bは合わせていない方の手の人差し指で指先の長さの違いを示す。Aは合わせた指先を見つめ、Bも指先へ視線を向けて微笑む。手を勢いよく打ち合わせるハイタッチではない';
    shot='ふたりの顔と、正面から合わせた手のひら、Bの指差す人差し指が大きく見える、手元を主役にした斜め前からの近めの上半身ツーショット。手の接触と指差しが隠れない構図';
  }
  if(c.label==='額を合わせる'){
    pose += '。ふたりの腕は自然に下ろし、手を握ったり相手の頭に触れたりしない';
    action='AとBが額の中央をそっと触れ合わせる。前髪で接触部分が隠れないように顔をわずかに横へ向け、鼻先ではなく額同士を合わせる';
    shot='2人の横顔と額の接触位置が前髪に隠れず確認できる斜め横からの上半身ツーショット';
  }
  const context=[];
  let prop=act.prop;
  if(c.poseKind==='rest'){
    if(/勉強を教え合っている/.test(act.label)){
      prop='勉強に使ったノートと筆記具がソファの前のローテーブルに置かれている';
      context.push('勉強をひと区切り終え、ふたりがソファで休憩している瞬間');
    }else if(/ゲーム/.test(act.label)){
      prop=place.includes('ベッド')?'遊び終えた携帯ゲーム機がベッド脇のサイドテーブルに置かれている':'遊び終えた携帯ゲーム機がソファ横のテーブルに置かれている';
      context.push('ゲームを終えてふたりがくつろぐ瞬間');
    }else if(/本を読/.test(act.label)){
      prop='読みかけの本がふたりのすぐ近くに置かれている';
      context.push('本をいったん置き、ふたりがくつろぎ始めた瞬間');
    }else if(/写真を見/.test(act.label)){
      prop='写真を表示したスマートフォンがふたりの近くに置かれている';
      context.push('写真を見終えて、ふたりがくつろぐ瞬間');
    }else if(/お茶を飲/.test(act.label)){
      prop='飲み終えたお茶のカップがソファの前のテーブルに置かれている';
      context.push('お茶を飲み終え、カップを置いてふたりがくつろぐ瞬間');
    }else if(movie)context.push('映画を眺めながらふたりがくつろいでいる');
  }else if(/料理|お菓子/.test(act.label))context.push('調理器具から手を離し、火元から離れた場所でひと休みする瞬間');
  else if(/勉強|ゲーム|本を読|写真を見|旅行の計画/.test(act.label))context.push('作業をいったん止めてふたりが触れ合う瞬間');
  if(act.kind==='shopping' && ['鼻先を合わせる','額を合わせる','頬にキスする','額にキスする','正面からハグする','頬に手を添える'].includes(c.label)){
    context.push('買い物の途中、人通りを避けた店先の脇で立ち止まった瞬間');
  }
  if(act.kind==='meeting' && ['鼻先を合わせる','額を合わせる','頬にキスする','額にキスする','正面からハグする'].includes(c.label)){
    context.push('人の流れから少し離れて立ち止まった瞬間');
  }
  if(watching && c.poseKind==='stand' && /向かい合って立ち/.test(pose))context.push('景色を眺めていたふたりが一度視線を交わす瞬間');
  if(/散歩/.test(act.label) && /向かい合って立ち/.test(pose))context.push('散歩の途中で立ち止まった瞬間');
  const bridges={
    '手のひらに文字を書く':'ふたりは遊び心から手のひらで秘密のメッセージを伝え合う',
    '手の大きさを比べる':'ふたりは会話の流れで手の大きさを比べ始める',
    '背中をさする':'Bが少し疲れた様子を見せ、Aがそっと気遣う'
  };
  if(bridges[c.label])context.push(bridges[c.label]);
  const celebrations={
    '散歩を楽しんでいる':'散歩中に話していたことが偶然一致し、ふたりは笑顔になる',
    '買い物を楽しんでいる':'気に入った商品を一緒に見つけ、ふたりは笑顔になる',
    '一緒に料理をしている':'料理がうまく仕上がり、ふたりは喜び合う',
    'お菓子を作っている':'お菓子がきれいに仕上がり、ふたりは喜び合う',
    '待ち合わせのあとに再会している':'無事に会えたことがうれしく、ふたりは笑顔になる'
  };
  if(['ハイタッチする','グータッチする'].includes(c.label))context.push(celebrations[act.label]||'話していたことがぴったり一致し、ふたりは笑顔になる');
  let sceneActivity=act.label;
  if(/プレゼントを渡している/.test(act.label)){
    sceneActivity='プレゼントを渡したあとの';
    if(c.poseKind==='sit')prop='渡し終えた小さなプレゼントの包みがふたりのそばに置かれている';
    else prop='渡し終えた小さなプレゼントの包みがBの片手にある';
    context.unshift('プレゼントを受け取ったBとAが、うれしそうに触れ合う瞬間');
    if(c.poseKind==='stand' && /手をそっと握る|指に自分の指を絡め|小指に自分の小指を絡め/.test(action)){
      action=action.replace('Bの手','Bの空いている方の手').replace('Bの指','Bの空いている方の手の指').replace('Bの小指','Bの空いている方の手の小指');
      pose=pose.replace('自然に腕を下ろしている','Bは包みを持っていない方の腕を自然に下ろしている');
    }
  }
  if(/勉強を教え合っている/.test(act.label) && c.poseKind==='rest'){
    sceneActivity='勉強を終えて休憩している';
  }
  if(/お茶を飲みながら話している/.test(act.label) && c.poseKind==='rest'){
    sceneActivity='お茶を飲み終えてくつろいでいる';
  }
  if(/プレゼントを渡している/.test(act.label) && c.poseKind==='stand' && /手をそっと握る|指に自分の指を絡め|小指に自分の小指を絡め/.test(c.action)){
    pose=pose.replace('互いの手を近づけている','Bは包みを持っていない方の手をAへ近づけている');
    if(!/Bは包みを持っていない方の手/.test(pose))pose=pose.replace('手を近づけている','Bは包みを持っていない方の手をAへ近づけている');
  }
  if(/手のひらを重ねる|手の甲をなでる|指先をなでる|手のひらに文字を書く|手を両手で包む/.test(c.label) && /上半身ツーショット/.test(shot)){
    shot=shot.replace('上半身ツーショット','手元まで収まる腰から上のツーショット');
  }
  const candidates=[{key:'正面',tail:''},{key:'斜め前',tail:'カメラは斜め前から捉える'},{key:'少し横',tail:'カメラは少し横から捉える'}];
  const composition=pickComposition(candidates);
  if(composition.tail && !/斜め前から|斜め横から|斜め後方から|斜め上から/.test(shot))shot+='。'+composition.tail;
  const extra=context.length?'。'+substitute(context.join('。')):'';
  const scene=`【場面】\n${a}と${b}は「${sceneActivity}」場面にいる。場所は「${place}」。${substitute(prop)}${extra}。\n\n【ふたりの動き】\n${substitute(pose)}。${substitute(action)}。\n\n【カメラ・構図】\n${substitute(shot)}。接触部位と身体の向きが自然に伝わる角度にする。`;
  const full=scene+'\n\n【画風】\n'+$('stylePrompt').value+'\n\n'+$('preservePrompt').value+'\n\n【ネガティブプロンプト】\n'+$('negativePrompt').value;
  $('output').textContent=full;
  $('status').textContent=`活動：${act.label} / 場所：${place} / スキンシップ：${c.label}`;
  return {act,c,place,full,pose,action,shot};
}
function save(){for(const k of ['stylePrompt','preservePrompt','negativePrompt'])localStorage.setItem('v07t_'+k,$(k).value);$('settingsStatus').textContent='設定を保存しました。';}
function reset(){for(const k of ['stylePrompt','preservePrompt','negativePrompt']){$(k).value=DEFAULTS[k];localStorage.removeItem('v07t_'+k)}$('settingsStatus').textContent='初期設定に戻しました。';build();}
for(const k of ['stylePrompt','preservePrompt','negativePrompt'])$(k).value=localStorage.getItem('v07t_'+k)||localStorage.getItem('v07s_'+k)||localStorage.getItem('v07r_'+k)||localStorage.getItem('v07q_'+k)||localStorage.getItem('v07p_'+k)||localStorage.getItem('v07n_'+k)||DEFAULTS[k];
$('generate').addEventListener('click',build);$('reroll').addEventListener('click',build);
$('copy').addEventListener('click',()=>navigator.clipboard.writeText($('output').textContent));
$('saveSettings').addEventListener('click',save);$('resetSettings').addEventListener('click',reset);
build();
</script></body></html>
